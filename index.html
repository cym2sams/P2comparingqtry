<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星際數學挑戰 🚀</title>
<style>
    :root { --primary: #4A90E2; --success: #2ECC71; --danger: #E74C3C; --warning: #F1C40F; --dark: #2C3E50; --light: #ECF0F1; }
    body { margin: 0; padding: 0; font-family: "PingFang HK", "Microsoft JhengHei", sans-serif; background-color: #1a1a2e; color: white; display: flex; flex-direction: column; min-height: 100vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.5); font-size: 20px; font-weight: bold; flex-shrink: 0; }
    .player-info { color: var(--success); }
    .btn-home { background: transparent; border: 1px solid rgba(255,255,255,0.3); color: #ccc; font-size: 14px; padding: 4px 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    .btn-home:hover { background: rgba(255,255,255,0.1); color: white; }
    .game-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; width: 100%; }
    #login-screen { background: var(--light); color: var(--dark); padding: 15px 20px; border-radius: 20px; max-width: 650px; width: 95%; box-shadow: 0 8px 20px rgba(0,0,0,0.4); text-align: center; box-sizing: border-box; margin: auto; max-height: 95vh; overflow-y: auto; }
    .login-title { font-size: 28px; margin: 0 0 10px 0; color: var(--primary); }
    .rules-box { background: #fff8e1; border: 3px dashed var(--warning); border-radius: 12px; padding: 8px 12px; text-align: left; margin-bottom: 15px; font-size: 15px; line-height: 1.4; color: #555; }
    .rules-box h3 { margin: 0 0 5px 0; font-size: 18px; color: var(--danger); text-align: center; }
    .rules-box p { margin: 0; }
    .login-inputs { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .login-select { font-size: 16px; padding: 6px 10px; border-radius: 8px; border: 2px solid var(--primary); font-weight: bold; outline: none; background: white; cursor: pointer; }
    .mini-leaderboard { margin-top: 15px; border-top: 2px solid #ccc; padding-top: 10px; }
    .mini-leaderboard h3 { font-size: 16px; color: var(--danger); margin: 0 0 5px 0; }
    .mini-table { width: 100%; border-collapse: collapse; font-size: 14px; background: white; }
    .mini-table th { background: var(--primary); color: white; padding: 4px; }
    .mini-table td { padding: 4px; border: 1px solid #eee; }
    .mini-table tr:nth-child(even) { background-color: #f9f9f9; }
    .question-box { background: var(--light); color: var(--dark); padding: 20px 30px; border-radius: 20px; max-width: 800px; width: 95%; box-shadow: 0 8px 20px rgba(0,0,0,0.4); margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; text-align: center; box-sizing: border-box; }
    .q-intro { font-size: 30px; font-weight: bold; color: var(--dark); }
    .q-compare { font-size: 30px; font-weight: bold; background-color: rgba(241, 196, 15, 0.25); padding: 6px 16px; border-radius: 10px; border: 2px dashed rgba(241, 196, 15, 0.5); display: inline-block; align-self: center; }
    .q-target { font-size: 30px; font-weight: bold; color: var(--dark); background-color: #e8f4fd; border: 3px solid var(--primary); padding: 6px 16px; border-radius: 10px; display: inline-block; align-self: center; }
    .equation-area { display: flex; justify-content: center; align-items: center; gap: 15px; font-size: 42px; font-weight: bold; margin-bottom: 20px; }
    .eq-box { background: white; color: var(--dark); border-radius: 12px; padding: 6px 18px; min-width: 50px; text-align: center; }
    .eq-circle { width: 65px; height: 65px; border-radius: 50%; border: 4px dashed var(--warning); background: rgba(255, 255, 255, 0.1); color: var(--warning); display: flex; align-items: center; justify-content: center; font-size: 42px; transition: all 0.3s; }
    .eq-circle.filled { border: 4px solid white; background: var(--dark); color: white; }
    .eq-circle.correct { border: 4px solid white; background: var(--success); color: white; }
    .eq-circle.wrong { border: 4px solid white; background: var(--danger); color: white; }
    .eq-ans { background: #ddd; color: #888; border: 3px solid #ccc; }
    .eq-ans.revealed { background: var(--primary); color: white; border-color: white; }
    .action-area { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .btn { border: none; border-radius: 16px; font-size: 34px; padding: 12px 30px; cursor: pointer; font-weight: bold; color: white; transition: transform 0.1s; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
    .btn:active { transform: translateY(6px); box-shadow: 0 0 0; }
    .btn-add { background-color: var(--primary); }
    .btn-sub { background-color: var(--danger); }
    .start-menu { display: flex; flex-direction: column; gap: 12px; align-items: center; width: 100%; }
    .btn-level { font-size: 26px; padding: 12px 20px; width: 95%; max-width: 550px; }
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; overflow-y: auto; padding: 15px 0; }
    .modal-content { background: white; color: var(--dark); padding: 20px 25px; border-radius: 20px; text-align: center; max-width: 700px; width: 95%; box-sizing: border-box; margin: auto; }
    .scaffold-title { color: var(--danger); font-size: 20px; margin-top: 0; margin-bottom: 10px; }
    .scaffold-continue-btn { font-size: 20px; padding: 10px 20px; border-radius: 10px; border: none; cursor: pointer; background: var(--primary); color: white; font-weight: bold; margin-top: 15px; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
    .scaffold-continue-btn:active { transform: translateY(4px); box-shadow: 0 0 0; }
    .bar-chart { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; align-items: flex-start; }
    .bar-row { display: flex; align-items: center; font-weight: bold; }
    .bar-label { width: 90px; font-size: 26px; text-align: right; margin-right: 15px; }
    .bar { height: 30px; border-radius: 8px; transition: width 1s ease-in-out; }
    .scaffold-btn { font-size: 26px; padding: 10px 30px; margin: 8px; border-radius: 12px; border: 2px solid #ccc; cursor: pointer; background: white; font-weight: bold; }
    .draw-arrow { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: dash 1s linear forwards; }
    @keyframes dash { to { stroke-dashoffset: 0; } }
    .leaderboard-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 16px; }
    .leaderboard-table th { background: var(--primary); color: white; padding: 6px; border: 1px solid #ddd; }
    .leaderboard-table td { padding: 6px; border: 1px solid #ddd; }
    .leaderboard-table tr:nth-child(even) { background-color: #f9f9f9; }
    .highlight-row { background-color: #ffeaa7 !important; font-weight: bold; }
</style>
</head>
<body>
<div class="header">
    <div style="display: flex; gap: 10px; align-items: center;">
        <button class="btn-home" id="btnHome" style="display:none;" onclick="backToLogin()">🏠 主頁</button>
        <div>⏱️ <span id="timeDisplay">1:00</span></div>
    </div>
    <div class="player-info" id="playerInfoDisplay">尚未登入</div>
    <div style="display: flex; gap: 10px; align-items: center;">
        <div>🚀 <span id="levelDisplay">-</span></div>
        <div>🌟 <span id="scoreDisplay">0</span> <span id="comboDisplay" style="color:var(--warning)"></span></div>
    </div>
</div>
<div class="game-container">
    <div id="login-screen">
        <h1 class="login-title">🚀 星際數學挑戰</h1>
        <div class="rules-box">
            <h3>🌟 遊戲玩法 🌟</h3>
            <p>1. ⏱️ <b>限時 60 秒：</b> 在時間內挑戰最高分！<br>
               2. 🧠 <b>填滿圓圈：</b> 仔細看題目，選出 ➕ 或 ➖。<br>
               3. 🔥 <b>沒有失敗：</b> 答錯不會出局，跟著提示學習！<br>
               4. ⚡ <b>連續加分：</b> 連續答對可啟動 Combo！</p>
        </div>
        <h2 style="font-size: 18px; margin: 5px 0;">請選擇你的身分：</h2>
        <div class="login-inputs">
            <select id="student-class" class="login-select" onchange="updateNumSelect()">
                <option value="">選擇班別</option>
                <option value="2A">2A</option><option value="2B">2B</option><option value="2C">2C</option><option value="2D">2D</option>
                <option value="教師">👨‍🏫 教師</option>
            </select>
            <select id="student-num" class="login-select"><option value="">選擇學號/姓名</option></select>
        </div>
        <button class="btn btn-add" style="background:var(--success); font-size:24px; padding: 10px 30px;" onclick="processLogin()">進入遊戲</button>
        <div class="mini-leaderboard" id="miniLeaderboardArea"></div>
    </div>
    <div id="game-ui" style="display:none; width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="question-box" id="questionText">請選擇你要挑戰的難度！</div>
        <div class="equation-area" id="equation-area" style="display:none;">
            <div class="eq-box" id="eq-x"></div><div class="eq-circle" id="eq-circle">?</div><div class="eq-box" id="eq-y"></div>
            <div>=</div><div class="eq-box eq-ans" id="eq-ans">?</div>
        </div>
        <div class="action-area" id="step1-area" style="display:none;">
            <button class="btn btn-add" onclick="checkOperator('+')">➕ 加法</button><button class="btn btn-sub" onclick="checkOperator('-')">➖ 減法</button>
        </div>
        <div class="start-menu" id="start-area">
            <button class="btn btn-level" style="background:var(--success);" onclick="startGame(1)">🟢 Level 1 (基礎：求相差 / 順向多與少)</button>
            <button class="btn btn-level" style="background:var(--warning); color:var(--dark);" onclick="startGame(2)">🟡 Level 2 (進階：逆向思考)</button>
            <button class="btn btn-level" style="background:var(--danger);" onclick="startGame(3)">🔴 Level 3 (綜合全題型挑戰)</button>
        </div>
    </div>
</div>
<div class="modal-overlay" id="scaffoldModal">
    <div class="modal-content">
        <h2 class="scaffold-title">⚠️ 暫停一下，我們來推理！</h2>
        <div id="scaf-sentence-container" style="position: relative; display: inline-block; padding-bottom: 40px; font-size: 28px; font-weight: bold; margin-bottom: 5px; width: 100%;">
            <span id="scaf-sentence"></span>
            <svg id="hint-svg" style="display:none; position:absolute; top: 40px; left:0; width: 100%; height: 50px;" xmlns="http://www.w3.org/2000/svg">
                <defs><marker id="arrowhead" markerWidth="6" markerHeight="5" refX="5" refY="2.5" orient="auto"><polygon points="0 0, 6 2.5, 0 5" fill="var(--danger)" /></marker></defs>
                <path id="hint-path" d="" fill="transparent" stroke="var(--danger)" stroke-width="3" marker-end="url(#arrowhead)"/>
            </svg>
        </div>
        <p id="scaffold-prompt-text" style="font-size: 24px;">這句句子中，『<span id="scaf-keyword-display" style="color:var(--danger); font-weight:bold;"></span>』是指誰？</p>
        <div id="scaffold-btns">
            <button class="scaffold-btn" id="btn-a" data-choice="A"></button><button class="scaffold-btn" id="btn-b" data-choice="B"></button>
        </div>
        <div class="bar-chart" id="barChartArea" style="display:none; width:100%; justify-content:center; align-items:center;">
            <div style="display:flex; flex-direction:column; gap:12px; width:100%; max-width: 400px; margin:0 auto;">
                <div class="bar-row"><div class="bar-label" id="bar-a-name">A</div><div class="bar" id="barA" style="width: 0px;"></div></div>
                <div class="bar-row"><div class="bar-label" id="bar-b-name">B</div><div class="bar" id="barB" style="width: 0px;"></div></div>
            </div>
        </div>
        <div id="scaffoldResult" style="display:none; margin-top: 15px;"></div>
        <button id="scaffoldContinue" class="scaffold-continue-btn" style="display:none;" onclick="closeScaffold()">我知道了，重新選方法！</button>
    </div>
</div>
<div class="modal-overlay" id="endModal">
    <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
        <h1 style="margin-top:0; color: var(--success);">🏆 遊戲完成！</h1>
        <p style="font-size: 24px; margin: 10px 0;">你這次的分數是：<span id="finalScore" style="color:var(--warning); font-weight:bold; font-size: 38px;">0</span></p>
        <p style="font-size: 22px; margin: 0 0 15px 0;">目前排名：第 <span id="currentRank" style="color:var(--danger); font-weight:bold; font-size: 32px;">-</span> 名</p>
        <h3 style="color: var(--primary); border-bottom: 2px solid #ccc; padding-bottom: 5px;">📜 本機最佳成績排行榜 </h3>
        <div id="leaderboardArea"></div>
        <div style="display: flex; gap: 15px; justify-content: center; margin-top: 20px; flex-wrap: wrap;">
            <button class="btn btn-add" style="background:var(--primary); font-size: 20px; padding: 10px 20px;" onclick="resetToMenu()">🎮 再玩一次</button>
            <button class="btn btn-add" style="background:var(--success); font-size: 20px; padding: 10px 20px;" onclick="backToHomeFromEnd()">🏠 回到主頁</button>
        </div>
    </div>
</div>

<script>
    var timeLeft = 60, score = 0, combo = 0, level = 1, timerInterval = null, currentQ = {}, isProcessing = false;
    var currentPlayer = { class: "", num: "" };
    var nameColors = { "小明": "#3498db", "小華": "#e67e22", "軒軒": "#9b59b6", "樂樂": "#1abc9c", "小麗": "#e74c3c", "小志": "#16a085", "美美": "#ff6b81", "晴晴": "#f39c12" };
    var colorGroups = { "小明": "blue", "軒軒": "purple", "小華": "orange", "晴晴": "orange", "樂樂": "green", "小志": "green", "小麗": "red", "美美": "red" };
    var names = ["小明", "小華", "軒軒", "樂樂", "小麗", "小志", "美美", "晴晴"];
    var items = ["粒糖", "部車仔", "支鉛筆", "張貼紙"];
    var teachersList = ["陳麗嫦校長", "袁紫茵老師", "陳曉晴老師", "黃柏榮老師", "陳慧淇老師"];

    window.onload = function() {
        updateNumSelect();
        renderMiniLeaderboard();
        document.getElementById("game-ui").style.display = "none";
        document.getElementById('btn-a').addEventListener('click', function() { executeSubjectCheck(this.dataset.choice); });
        document.getElementById('btn-b').addEventListener('click', function() { executeSubjectCheck(this.dataset.choice); });
    };

    function updateNumSelect() {
        var sClass = document.getElementById("student-class").value;
        var numSelect = document.getElementById("student-num");
        numSelect.innerHTML = '<option value="">選擇學號/姓名</option>';
        if (sClass === "教師") { teachersList.forEach(t => numSelect.innerHTML += `<option value="${t}">${t}</option>`); }
        else if (sClass !== "") { for(let i = 1; i <= 30; i++) { numSelect.innerHTML += `<option value="${i}">${i}號</option>`; } }
    }

    function renderMiniLeaderboard() {
        var leaderboard = JSON.parse(localStorage.getItem("mathLeaderboard_P2") || "[]");
        var lbArea = document.getElementById("miniLeaderboardArea");
        if (leaderboard.length === 0) {
            lbArea.innerHTML = "<p style='color:#888; font-size:14px; margin: 5px 0;'>暫無紀錄，快來成為全級第一名！</p>";
            return;
        }
        var html = '<h3>🏆 Top 5 神射手</h3><table class="mini-table"><tr><th>排名</th><th>身分</th><th>最高分</th></tr>';
        leaderboard.slice(0, 5).forEach((p, i) => {
            let rankDisplay = i < 3 ? ['🥇','🥈','🥉'][i] : (i+1);
            let identity = p.class === "教師" ? p.num : `${p.class} ${p.num}號`;
            html += `<tr><td>${rankDisplay}</td><td>${identity}</td><td style="color:var(--danger); font-weight:bold;">${p.bestScore}</td></tr>`;
        });
        lbArea.innerHTML = html + '</table>';
    }

    function processLogin() {
        var sClass = document.getElementById("student-class").value;
        var sNum = document.getElementById("student-num").value;
        if (!sClass || !sNum) { alert("請先選擇您的身分喔！"); return; }
        currentPlayer = { class: sClass, num: sNum };
        let identityDisplay = sClass === "教師" ? sNum : `${sClass}班 ${sNum}號`;
        document.getElementById("playerInfoDisplay").innerText = `👤 ${identityDisplay}`;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("game-ui").style.display = "flex";
        document.getElementById("btnHome").style.display = "inline-block";
        resetToMenu();
    }
    
    function backToLogin() {
        if(timerInterval) clearInterval(timerInterval);
        timerInterval = null;
        document.getElementById("game-ui").style.display = "none";
        document.getElementById("btnHome").style.display = "none";
        document.getElementById("login-screen").style.display = "block";
        document.getElementById('timeDisplay').innerText = '1:00';
        document.getElementById('scoreDisplay').innerText = '0';
        renderMiniLeaderboard();
    }

    function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function getRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function colorName(name) { return `<span style="color:${nameColors[name]}; font-weight:bold;">${name}</span>`; }
    function resetEquationCircle() {
        let circle = document.getElementById('eq-circle');
        circle.innerText = '?';
        circle.className = 'eq-circle';
        let eqAns = document.getElementById('eq-ans');
        eqAns.innerText = '?';
        eqAns.className = 'eq-box eq-ans';
        isProcessing = false;
    }

    function generateQuestion() {
        resetEquationCircle();
        let nameA = getRandom(names), nameB, item = getRandom(items);
        do { nameB = getRandom(names); } while (nameB === nameA || colorGroups[nameB] === colorGroups[nameA]);
        
        let qCategory, rand = Math.random();
        if (level === 1) { qCategory = rand < 0.5 ? 'diff' : 'L1_target'; }
        else if (level === 2) { qCategory = 'L2_target'; }
        else { qCategory = rand < 0.33 ? 'diff' : (rand < 0.66 ? 'L1_target' : 'L2_target'); }

        let X, Y, ans, operator, text, keyword, isTargetB = false;

        if (qCategory === 'diff') {
            let big = randomInt(7, 15), small = randomInt(2, big - 1), isAMore = Math.random() > 0.5;
            let valA = isAMore ? big : small, valB = isAMore ? small : big;
            ans = big - small; operator = '-';
            let askText = Math.random() > 0.5 ? `${colorName(nameA)} 比 ${colorName(nameB)} 多幾多${item}？` : `${colorName(nameB)} 比 ${colorName(nameA)} 少幾多${item}？`;
            text = `<div class="q-intro">${colorName(nameA)} 有 ${valA} ${item}。</div><div class="q-intro">${colorName(nameB)} 有 ${valB} ${item}。</div><div class="q-target">${askText}</div>`;
            X = big; Y = small;
            currentQ = { nameA, nameB, item, X, Y, valA, valB, ans, operator, qCategory, isTargetB: false };
        } else {
            Y = qCategory === 'L1_target' ? randomInt(2, 6) : randomInt(2, 8);
            if (qCategory === 'L1_target') {
                isTargetB = true; X = randomInt(8, 14);
                if (Math.random() > 0.5) { ans = X - Y; operator = '-'; keyword = '少'; } else { ans = X + Y; operator = '+'; keyword = '多'; }
                text = `<div class="q-intro">${colorName(nameA)} 有 ${X} ${item}。</div><div class="q-compare">${colorName(nameB)} 比 ${colorName(nameA)} ${keyword} ${Y} ${item}。</div><div class="q-target">${colorName(nameB)} 有幾多${item}？</div>`;
            } else { // L2_target
                isTargetB = false;
                if (Math.random() > 0.5) { ans = randomInt(4, 12); X = ans + Y; operator = '-'; keyword = '多'; } else { X = randomInt(4, 12); ans = X + Y; operator = '+'; keyword = '少'; }
                text = `<div class="q-intro">${colorName(nameA)} 有 ${X} ${item}。</div><div class="q-compare">${colorName(nameA)} 比 ${colorName(nameB)} ${keyword} ${Y} ${item}。</div><div class="q-target">${colorName(nameB)} 有幾多${item}？</div>`;
            }
            currentQ = { nameA, nameB, item, X, Y, ans, operator, keyword, qCategory, isTargetB, scafS1: isTargetB ? nameB : nameA, scafS2: isTargetB ? nameA : nameB };
        }
        document.getElementById('questionText').innerHTML = text;
        document.getElementById('eq-x').innerText = X;
        document.getElementById('eq-y').innerText = Y;
        ['equation-area', 'step1-area'].forEach(id => document.getElementById(id).style.display = 'flex');
        document.getElementById('start-area').style.display = 'none';
    }

    function checkOperator(op) {
        if(isProcessing) return;
        isProcessing = true;
        let circle = document.getElementById('eq-circle');
        circle.innerText = op; circle.classList.add('filled');
        if (op === currentQ.operator) {
            circle.classList.add('correct');
            let eqAns = document.getElementById('eq-ans');
            eqAns.innerText = currentQ.ans; eqAns.classList.add('revealed');
            combo++; score += Math.floor((level * 10) * (combo > 2 ? 1.5 : 1));
            updateHeader();
            setTimeout(() => { if (timeLeft > 0) generateQuestion(); }, 1200);
        } else {
            circle.classList.add('wrong'); combo = 0; updateHeader();
            setTimeout(() => { if (timeLeft > 0) openScaffold(); }, 600);
        }
    }

    function openScaffold() {
        if(timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        document.getElementById('scaffoldModal').style.display = 'flex';
        let isDiff = currentQ.qCategory === 'diff';
        document.getElementById('scaf-sentence-container').style.display = isDiff ? 'none' : 'inline-block';
        document.getElementById('scaffold-prompt-text').style.display = isDiff ? 'none' : 'block';
        document.getElementById('scaffold-btns').style.display = isDiff ? 'none' : 'block';
        document.getElementById('barChartArea').style.display = isDiff ? 'flex' : 'none';
        
        if (isDiff) {
            document.getElementById('bar-a-name').innerHTML = colorName(currentQ.nameA);
            document.getElementById('bar-b-name').innerHTML = colorName(currentQ.nameB);
            document.getElementById('barA').style.backgroundColor = nameColors[currentQ.nameA];
            document.getElementById('barB').style.backgroundColor = nameColors[currentQ.nameB];
            let resText = '<div style="font-size: 18px; color: #777; margin-bottom: 10px;">💡 提示：</div><div style="background-color: #fff8e1; border: 3px dashed var(--warning); border-radius: 12px; padding: 15px 20px;"><div style="font-size: 20px; color: #555; margin-bottom: 5px;">比較兩個數量找相差，</div><div style="font-size: 32px; font-weight: 900; color: var(--danger); line-height: 1.3;">我們一定要用 減法 ➖ 喔！</div></div>';
            document.getElementById('scaffoldResult').innerHTML = resText;
            document.getElementById('scaffoldResult').style.display = 'block';
            setTimeout(() => {
                document.getElementById('barA').style.width = (currentQ.valA * 12 + 40) + 'px';
                document.getElementById('barB').style.width = (currentQ.valB * 12 + 40) + 'px';
                document.getElementById('scaffoldContinue').style.display = 'inline-block';
            }, 300);
        } else {
            let { scafS1, scafS2, keyword, Y, item } = currentQ;
            document.getElementById('scaf-sentence').innerHTML = `「<span id="w-subj1">${colorName(scafS1)}</span> 比 <span id="w-subj2">${colorName(scafS2)}</span> <span id="w-keyword" style="color:var(--danger)">${keyword}</span> ${Y} ${item}」`;
            document.getElementById('scaf-keyword-display').innerText = keyword;
            document.getElementById('btn-a').innerHTML = colorName(scafS1);
            document.getElementById('btn-b').innerHTML = colorName(scafS2);
        }
    }
    
    function executeSubjectCheck(btnChoice) {
        if (btnChoice === 'A') { // Correct choice
            document.getElementById('scaffold-btns').style.display = 'none';
            document.getElementById('scaffold-prompt-text').style.display = 'none';
            document.getElementById('barChartArea').style.display = 'flex';
            let { scafS1, scafS2, keyword, operator } = currentQ;
            let cSubj = colorName(scafS1), cOther = colorName(scafS2);
            let resText = `<div style="font-size: 18px; color: #777; margin-bottom: 8px;">✅ 答對了！『${keyword}』是指 ${cSubj}。</div><div style="background-color: #fff8e1; border: 3px dashed var(--warning); border-radius: 12px; padding: 12px 20px;"><div style="font-size: 20px; color: #555; margin-bottom: 5px;">所以，</div>`;
            resText += keyword === '少' ? `<div style="font-size: 32px; font-weight: 900; color: var(--dark); line-height: 1.3;">${cSubj} 較少，<br>${cOther} 較多！</div></div>` : `<div style="font-size: 32px; font-weight: 900; color: var(--dark); line-height: 1.3;">${cSubj} 較多，<br>${cOther} 較少！</div></div>`;
            document.getElementById('scaffoldResult').innerHTML = resText;
            document.getElementById('scaffoldResult').style.display = 'block';
            document.getElementById('bar-a-name').innerHTML = cSubj;
            document.getElementById('bar-b-name').innerHTML = cOther;
            document.getElementById('barA').style.backgroundColor = nameColors[scafS1];
            document.getElementById('barB').style.backgroundColor = nameColors[scafS2];
            setTimeout(() => {
                let baseWidth = 120, diffWidth = 80;
                let isPlus = operator === '+';
                document.getElementById('barA').style.width = (isPlus ? baseWidth : baseWidth + diffWidth) + 'px';
                document.getElementById('barB').style.width = (isPlus ? baseWidth + diffWidth : baseWidth) + 'px';
                document.getElementById('scaffoldContinue').style.display = 'inline-block';
            }, 300);
        } else { // Wrong choice
            handleWrongChoice();
        }
    }
    
    function handleWrongChoice() {
        document.getElementById('scaffold-prompt-text').innerHTML = `哎呀，再看清楚！『<span style="color:var(--danger); font-weight:bold;">${currentQ.keyword}</span>』是緊接著誰的名字？`;
        let k = document.getElementById('w-keyword'), s1 = document.getElementById('w-subj1'), svg = document.getElementById('hint-svg'), path = document.getElementById('hint-path'), container = document.getElementById('scaf-sentence-container');
        if (k && s1 && svg && path && container) {
            let containerRect = container.getBoundingClientRect(), kRect = k.getBoundingClientRect(), s1Rect = s1.getBoundingClientRect();
            let startX = (kRect.left + kRect.width / 2) - containerRect.left;
            let endX = (s1Rect.left + s1Rect.width / 2) - containerRect.left;
            let midX = (startX + endX) / 2;
            svg.style.display = 'block';
            path.setAttribute('d', `M ${startX} 0 Q ${midX} 40 ${endX} 0`);
            path.classList.remove('draw-arrow');
            void path.offsetWidth;
            path.classList.add('draw-arrow');
        }
    }

    function closeScaffold() {
        document.getElementById('scaffoldModal').style.display = 'none';
        // 釜底抽薪：徹底還原提示視窗內的所有動態內容
        document.getElementById('scaffold-prompt-text').innerHTML = '這句句子中，『<span id="scaf-keyword-display" style="color:var(--danger); font-weight:bold;"></span>』是指誰？';
        document.getElementById('scaffoldResult').style.display = 'none';
        document.getElementById('scaffoldContinue').style.display = 'none';
        document.getElementById('hint-svg').style.display = 'none';
        
        if (!timerInterval) { timerInterval = setInterval(updateTime, 1000); }
        resetEquationCircle();
    }

    function updateHeader() {
        document.getElementById('scoreDisplay').innerText = score;
        document.getElementById('levelDisplay').innerText = level;
        document.getElementById('comboDisplay').innerText = combo >= 2 ? `(🔥Combo x${combo})` : '';
    }

    function updateTime() {
        if (timeLeft > 0) {
            timeLeft--;
            let m = Math.floor(timeLeft / 60), s = timeLeft % 60;
            document.getElementById('timeDisplay').innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
        } else { endGame(); }
    }

    function startGame(selectedLevel) {
        if(timerInterval) clearInterval(timerInterval);
        level = selectedLevel; score = 0; timeLeft = 60; combo = 0;
        updateHeader();
        generateQuestion();
        document.getElementById('timeDisplay').innerText = '1:00';
        timerInterval = setInterval(updateTime, 1000);
    }

    function saveAndGetLeaderboard() {
        let playerID = `${currentPlayer.class}-${currentPlayer.num}`;
        let leaderboard = JSON.parse(localStorage.getItem("mathLeaderboard_P2") || "[]");
        let playerIndex = leaderboard.findIndex(p => p.id === playerID);
        if (playerIndex > -1) {
            leaderboard[playerIndex].attempts++;
            leaderboard[playerIndex].bestScore = Math.max(score, leaderboard[playerIndex].bestScore);
        } else {
            leaderboard.push({ id: playerID, class: currentPlayer.class, num: currentPlayer.num, bestScore: score, attempts: 1 });
        }
        leaderboard.sort((a, b) => b.bestScore - a.bestScore);
        
        // 🌟 更新排名
        let currentRank = leaderboard.findIndex(p => p.id === playerID) + 1;
        document.getElementById('currentRank').innerText = currentRank > 0 ? currentRank : '-';
        
        try { localStorage.setItem("mathLeaderboard_P2", JSON.stringify(leaderboard)); } catch(e) { console.error("Failed to save to localStorage", e); }
        
        let html = '<table class="leaderboard-table"><tr><th>排名</th><th>身分</th><th>最佳分數</th><th>挑戰次數</th></tr>';
        leaderboard.forEach((p, i) => {
            let rowClass = p.id === playerID ? 'highlight-row' : '';
            let rankDisplay = i < 3 ? ['🥇','🥈','🥉'][i] : (i+1);
            let identity = p.class === "教師" ? p.num : `${p.class}班 ${p.num}號`;
            html += `<tr class="${rowClass}"><td>${rankDisplay}</td><td>${identity}</td><td style="color:var(--danger); font-weight:bold;">${p.bestScore}</td><td>${p.attempts}次</td></tr>`;
        });
        return html + '</table>';
    }

    function endGame() {
        if(timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        document.getElementById('finalScore').innerText = score;
        document.getElementById('leaderboardArea').innerHTML = saveAndGetLeaderboard();
        document.getElementById('endModal').style.display = 'flex';
    }
    
    function backToHomeFromEnd() {
        document.getElementById('endModal').style.display = 'none';
        backToLogin();
    }

    function resetToMenu() {
        document.getElementById('endModal').style.display = 'none';
        document.getElementById("questionText").innerHTML = "請選擇你要挑戰的難度！";
        document.getElementById("start-area").style.display = "flex";
        document.getElementById("step1-area").style.display = "none";
        document.getElementById("equation-area").style.display = "none";
        document.getElementById('timeDisplay').innerText = '1:00';
        document.getElementById('scoreDisplay').innerText = '0';
        renderMiniLeaderboard();
    }
</script>
</body>
</html>
